# ==============================================================================
# methodology.yaml - 全域原子思维模型与认知透镜字典 (SSOT，迁移自 116)
#
# 【核心规约与认知公理】：
# 1. 元素周期表定律：本字典【仅且只存放不可再分的最小单体原子模型】，
#    严禁存入“化合物”（如“福格模型+微习惯+动线”等组合），防止组合爆炸；
# 2. 运行时动态化合：具体 MOC 编织、Slip 深度分析与研报产出时，由智能体根据卡片特征调取 1~2 个原子，
#    化合成通俗的叙事视角；
# 3. 涵盖全人类常态生活的核心领域：工程架构、学习认知、教育养育、生活身心、商业决策、人文哲学。
# ==============================================================================

version: "2.1.0"
updated: "2026-11-15"

domains:
  work_tech:
    label: "💻 工程、架构与技术系统"
    description: "关注系统稳定性、算力与资源利用率、技术演进路线与生产级容灾"
    lenses:
      - id: "first_principles_cost"
        name: "第一性原理与成本极限"
        core_concept: "回归硬件物理限制与数学复杂度公理，剥离历史妥协冗余，自顶向下寻找最具性价比的极简工程路径。"
        lens_focus: "从算力开销、显存物理上限、硬件带宽与吞吐极限审视方案，追求极致降本增效。"
        triggers: [成本, 显存, 延迟, 开销, 算力, 压缩, 吞吐, 剪枝, 物理限制, 基准对比, 资源利用率]

      - id: "evolutionary_pathway"
        name: "技术演进脉络与选型抉择"
        core_concept: "任何技术都是对前代缺陷的补丁或颠覆；理解技术必须理解其历史演进因果与分歧抉择点。"
        lens_focus: "回溯从旧方案到新方案的技术动因，梳理替代链 (supersedes)，呈现分歧路线的权衡对比。"
        triggers: [演进, 历史, 替代, supersedes, 路线, 选型, 变革, 淘汰, 范式转换]

      - id: "system_thinking"
        name: "系统动力学与整体涌现"
        core_concept: "关注系统要素之间的正负反馈回路、时延与整体涌现性，而非孤立部件；审视因果闭环与系统性瓶颈。"
        lens_focus: "识别系统中的增强回路、调节回路与时滞瓶颈，分析微观机制如何涌现出宏观系统行为。"
        triggers: [系统思维, 反馈回路, 正反馈, 负反馈, 涌现, 动力学, 闭环, 整体性, 级联反应]

      - id: "modularity_decoupling"
        name: "高内聚低耦合与分层契约"
        core_concept: "通过严格的接口契约与职责单一原则，隔离变化波及范围，实现各层独立演进与水平扩展。"
        lens_focus: "审视系统模块划分：是否各司其职？状态机流转是否清晰？接口边界是否足够松耦合？"
        triggers: [模块化, 解耦, 分层, 接口, 契约, 架构设计, 抽象, 职责单一, 微服务]

      - id: "failure_mode_risk"
        name: "失效模式与反脆弱容灾"
        core_concept: "假设一切都会失败；关注系统在极端边界、长程运行或恶意对抗下的退化与自愈机制。"
        lens_focus: "排查瓶颈、假说 (hypothesis)、失真风险、级联雪崩与长程遗忘，构建降级、熔断与对冲方案。"
        triggers: [风险, 失效, 瓶颈, 漏洞, 降级, 熔断, 容灾, 假说, hypothesis, 攻击, 一致性, 异常]

      - id: "trade_off_matrix"
        name: "工程权衡与多维决策矩阵"
        core_concept: "工程没有银弹，只有权衡取舍 (Trade-offs)；任何优势的背后都暗含着对另一维度的牺牲。"
        lens_focus: "将互相冲突的指标（如性能 vs 成本、一致性 vs 可用性）拉平为多维对比矩阵与象限图。"
        triggers: [权衡, 取舍, trade-off, 优劣, 选型, 对比矩阵, 象限, 综合评估]

  learning_cognition:
    label: "🧠 学习、元认知与思维"
    description: "关注人类心智学习规律、记忆固化机制与心智模型构建"
    lenses:
      - id: "feynman_technique"
        name: "费曼逆向倒逼与通俗隐喻"
        core_concept: "向完全不懂的外行讲清楚，是检验真懂的唯一标准；寻找生活常识类比，击碎行话伪装。"
        lens_focus: "剥离专业术语，寻找直觉化类比隐喻，定位思维盲区，倒逼出极简大白话教案。"
        triggers: [费曼, 隐喻, 通俗, 类比, 大白话, 讲授, 认知盲区, 初学者]

      - id: "mece_structuring"
        name: "MECE 结构化与正交穷尽"
        core_concept: "相互独立、完全穷尽 (Mutually Exclusive, Collectively Exhaustive)；将复杂事物切分为无重叠的完整维度。"
        lens_focus: "校验分类维度是否重叠、是否存在逻辑死角，保证论述框架层级严密且全面覆盖。"
        triggers: [MECE, 正交, 穷尽, 结构化, 分类, 维度划分, 逻辑树, 互不重叠]

      - id: "causality_linkage"
        name: "因果拓扑与前后推导"
        core_concept: "严格区分因果关系与表面相关性；理清事实证据链、前置依赖前提与衍生推导结论。"
        lens_focus: "审视前置假设是否自足、推导步骤是否严密，构建可验证的因果图谱与溯源神经元网络。"
        triggers: [因果, 推导, 前提, 依赖, 证据链, 必然性, 关联性, 逻辑因果]

      - id: "cognitive_load"
        name: "认知负荷与组块化构建"
        core_concept: "人类工作记忆极其有限 (3~4个信息块)；唯有压缩降低内在负荷并组块化，才能内化为图式。"
        lens_focus: "重构知识密度：消除外在无关干扰，降低理解阻抗，将零散概念打包为易记的认知组块。"
        triggers: [认知负荷, 工作记忆, 组块, 图式, 记忆瓶颈, 降噪, 信息过载]

      - id: "deliberate_practice"
        name: "刻意练习与舒适区进阶"
        core_concept: "重复不等于进步；真正的精进发生在舒适区边缘，依赖高度聚焦、心理表征与即时反馈。"
        lens_focus: "拆解进阶阶梯：找出核心卡点微技能，设计针对性强化训练与毫秒级反馈回路。"
        triggers: [刻意练习, 舒适区, 技能树, 进阶, 心理表征, 即时反馈, 专项训练]

      - id: "inversion_thinking"
        name: "逆向倒推思维 (逆向工程)"
        core_concept: "反过来想，总是反过来想；与其思考如何成功，不如穷尽所有导致彻底失败的愚蠢行为并避开。"
        lens_focus: "从终局或反面视角倒推：先列出所有常见的犯错坑点与败因清单，实现防御性自愈。"
        triggers: [逆向, 倒推, 避免失败, 避坑, 查理芒格, 常见误区, 反思]

  education_parenting:
    label: "👶 养育、成长与教育心理"
    description: "关注儿童心智发展阶段、内驱力呵护与家庭教育场域"
    lenses:
      - id: "zpd_scaffolding"
        name: "最近发展区与脚手架模型"
        core_concept: "不拔苗助长也不过度包办；以当下心智极限为基准，搭建'跳一跳够得着'的台阶并适时放手。"
        lens_focus: "按认知生理规律分层，在关键卡点提供微小辅助，并在掌握后逐步撤除外力。"
        triggers: [最近发展区, 脚手架, 阶梯, 年龄阶段, 辅导, 拔苗助长, 适时放手]

      - id: "self_determination"
        name: "自我决定论与内驱力保护"
        core_concept: "持久的兴趣源于内在动机（自主感、胜任感、归属感）；过度外在奖惩往往会杀死自发内驱力。"
        lens_focus: "审视互动机制：哪些动作保护了掌控感与好奇心？哪些催促与奖励产生了过度理由效应？"
        triggers: [内驱力, 自主感, 胜任感, 归属感, 兴趣, 好奇心, 奖惩副作用]

      - id: "emotional_container"
        name: "情绪容器与共情接纳"
        core_concept: "先处理情绪，再处理事情；成年人是情绪风暴的稳定容器，提供无条件的心理安全感。"
        lens_focus: "设计情绪急救流向：觉察命名情绪、身体接纳平静、最后进行理性复盘与边界确认。"
        triggers: [情绪, 共情, 情绪容器, 心理安全, 哭闹, 倾听, 接纳]

      - id: "natural_consequences"
        name: "自然结果与坚定边界"
        core_concept: "让现实与自然法则承担教育责任；保持温和而坚定，用自然发生的结果取代说教与惩罚。"
        lens_focus: "建立清晰的前置约定与物理边界，允许在可控范围内体验失误后果，学会自主负责。"
        triggers: [自然结果, 边界, 规则, 温和坚定, 负责, 惩罚, 自律]

  life_wellness:
    label: "🏃 生活、身心与日常习惯"
    description: "关注个人精力管理、行为习惯回路设计与身心健康反脆弱"
    lenses:
      - id: "fogg_behavior"
        name: "福格行为模型 (B=MAP)"
        core_concept: "行为的发生必须同时满足动机 (M)、极低能力门槛 (A) 与环境触发提示 (P)；动机不可靠，门槛是王道。"
        lens_focus: "消除阻抗：把第一步动作切片压缩至 30 秒以内，让好行为阻力为 0，坏行为阻力无穷大。"
        triggers: [习惯, 拖延, 启动门槛, 动机, 阻力, 微习惯, 触发器, 福格]

      - id: "spatial_ergonomics"
        name: "空间场域与物理动线设计"
        core_concept: "物理环境对行为有强烈的无声塑形力；触手可及与视线所及的距离，直接决定行为发生的概率。"
        lens_focus: "规划物理动线：通过视觉显眼化、物品归位动线与声光降噪，打造沉浸场域。"
        triggers: [动线, 空间, 场域, 视觉降噪, 物品摆放, 环境设计, 触手可及]

      - id: "circadian_energy"
        name: "生物节律与精力波峰管理"
        core_concept: "时间不可管理，精力可以管理；顺应皮质醇与褪黑素的昼夜起伏，在不同生理波段做对的事。"
        lens_focus: "不排死板日程表，而是将深度思考、体力消耗与松弛休整，精准匹配到人体的精力节律周期。"
        triggers: [节律, 精力, 生物钟, 睡眠, 晨间, 疲劳, 褪黑素, 深度休息]

      - id: "via_negativa"
        name: "减法防御与反脆弱排毒"
        core_concept: "不做什么比做什么更具决定性；排除有害项（垃圾输入、超加工食品、内耗关系）让系统自愈。"
        lens_focus: "列出禁忌清单与极简断舍离：通过停止过度干预与负面消耗，自然收获身心稳态。"
        triggers: [减法, 断舍离, 禁忌, 排除, 反脆弱, 极简, 止损, 饮食干预]

  business_strategy:
    label: "📈 商业、战略与重大决策"
    description: "关注商业壁垒、长期复利与不确定性环境下的高胜率决策"
    lenses:
      - id: "economic_moat"
        name: "经济护城河与结构性壁垒"
        core_concept: "超越单纯的技术领先；寻找能长期阻挡竞争对手掠夺超额收益的结构性壁垒。"
        lens_focus: "从网络效应、高转换成本、无形资产与规模成本优势四大维度，检验商业模式的可持续性。"
        triggers: [护城河, 壁垒, 转换成本, 网络效应, 竞争优势, 垄断, 商业模式]

      - id: "second_order_thinking"
        name: "第二层思维与非直觉推演"
        core_concept: "初学者看眼前直接结果，高手思考'然后呢？'；寻找看似短期不利但长期具有巨大复合收益的决策。"
        lens_focus: "推演决策的二阶、三阶连锁反应，识别市场大众直觉共识背后的非对称错误定价。"
        triggers: [第二层思维, 连锁反应, 然后呢, 非直觉, 长期主义, 复合效应]

      - id: "flywheel_effect"
        name: "增长飞轮与自增强回路"
        core_concept: "各业务要素不是孤立并列的，而是环环相扣、单向正向反馈；前一步的成果自动成为下一步的燃料。"
        lens_focus: "梳理业务自增强闭环：明确飞轮的起步齿轮是什么？如何实现越转越快且边际成本递减？"
        triggers: [飞轮, 正反馈, 增强回路, 增长闭环, 边际成本, 协同效应]

      - id: "opportunity_cost"
        name: "机会成本与资源排他分配"
        core_concept: "任何选择的真实成本，都是被放弃的最高价值备选；忽略沉没成本，专注于稀缺资源的最优回报。"
        lens_focus: "评估战略取舍：做这件事意味着放弃什么？当前投入是否是注意力与资金的最高杠杆点？"
        triggers: [机会成本, 沉没成本, 资源分配, 取舍, 最高杠杆, ROI, 投资回报]

      - id: "swot_posture"
        name: "态势分析与四象限扫描"
        core_concept: "基于优势、劣势、机会、威胁四象限，系统盘点内外部资源禀赋与外部环境挑战。"
        lens_focus: "梳理内外部态势：如何发挥优势抓住机会？如何规避威胁化解内部劣势？"
        triggers: [SWOT, 态势分析, 优势, 劣势, 机会, 威胁, 竞争态势]

  humanities_philosophy:
    label: "📜 人文、哲学与心智觉察"
    description: "关注存在意义、思想演进对抗与内省觉察"
    lenses:
      - id: "stoic_dichotomy"
        name: "斯多葛控制二分法"
        core_concept: "世间事物分为两类：我们能完全控制的（信念、欲望、行动），和我们不能完全控制的（外界评价、结果、环境）。"
        lens_focus: "彻底停止为不可控的事焦虑耗费能量，将 100% 的注意力回收至自身唯一可控的最小行动中。"
        triggers: [斯多葛, 控制二分, 焦虑, 内耗, 专注当下, 接纳, 心理韧性]

      - id: "hegelian_dialectic"
        name: "正反合辩证演进"
        core_concept: "思想在自我否定与矛盾冲突中升华：正题产生其对立的反题，最终在更高维度化合为合题。"
        lens_focus: "正视并放大体系中的核心矛盾两极，不搞简单的折中妥协，寻找能够兼容并包的全新合题解法。"
        triggers: [正反合, 辩证法, 矛盾, 对立, 冲突, 升华, 否定之否定]

      - id: "entropy_dissipative"
        name: "熵增定律与耗散结构"
        core_concept: "孤立系统必然自发走向混乱与瓦解；唯有保持对外开放并持续引入负熵流，才能维持活力与演化。"
        lens_focus: "诊断系统的封闭僵化程度：如何打破信息孤岛？从外界引入何种新能量与新认知对抗衰亡？"
        triggers: [熵增, 负熵, 耗散结构, 混乱, 开放系统, 自组织, 活力]
